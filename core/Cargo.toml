[package]
name = "wotslog-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Tauri-independent log processing, redaction, approvals and AI client for WotsLog AI"
autobins = false
autotests = false

[lib]
name = "wotslog_core"

[[bin]]
name = "log_bench"
path = "src/bin/log_bench.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
memchr = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
keyring = { version = "3.6", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
