[package]
name = "wotslog-ai"
version = "0.1.0"
description = "Local-first AI-assisted log analyzer"
edition = "2024"
rust-version = "1.90"
default-run = "wotslog-ai"

[lib]
name = "wotslog_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
wotslog-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
